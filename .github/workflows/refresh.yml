name: Refresh public Scholar data
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholar-refresh-main
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Validate collector
        run: node --test refresh.test.mjs
      - name: Reserve one collection attempt per UTC day
        id: reserve
        run: node refresh.mjs reserve
      - name: Persist reservation before any external query
        if: steps.reserve.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refresh-state.json
          git commit -m 'chore(data): reserve daily Scholar refresh'
          git push origin HEAD:main
      - name: Collect and publish validated data
        if: steps.reserve.outputs.run == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          node refresh.mjs collect
          if ! git diff --quiet -- scholar.json; then
            git add scholar.json
            git commit -m 'data: update verified Scholar citation snapshot'
            git push origin HEAD:main
          fi
